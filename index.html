function publishing(){const b=DATA.find(b=>b.id===state.book),r=resource(state),d=state.decision;let explanation='先作一次选择，再检验你的理由。',body='出版从来不只是一个艺术判断，也是资源条件下的现实选择。请结合社会需要、市场需求与编辑投入作出决定。';if(d==='publish'){explanation=r.feasible?'资源允许出版，但这还不是传播的终点。':'你有出版意愿，但生产条件尚未满足。';body=r.feasible?'当前预算与编辑时间覆盖了模拟需求。是否出版仍涉及内容质量、读者需求与组织判断，资源可行不等于必然成功。':`仍缺 ${r.moneyGap} 万元与 ${r.timeGap} 周编辑时间。试着开启专项支持，或选择调整方案；观察个人意愿如何受到具体条件制约。`;}if(d==='adjust'){explanation=r.feasible?'缩小范围后，方案满足资源条件。':'调整后，仍需补足生产资源。';body='模拟将选题范围收缩：成本减少 3 万元、编辑投入减少 2 周。代价是材料覆盖减少；能否保留关键问题，需要重新审稿，不能仅以节约成本衡量。';}if(d==='hold'){explanation='暂缓，是在当前条件下保留判断。';body='暂缓并不等于内容没有价值。可以继续寻找资源、补充材料或等待更合适的生产条件；也要讨论延迟出版意味着哪些经验继续缺席。';}return `<section class="screen">${heading(1,'生产条件','这本书能出版吗？','社会需要、市场需求与编辑资源，会把选择引向哪里？')}<div class="workbench"><div><div class="section-title"><h2>选择一个选题</h2></div><p class="muted small">不同选题，意味着不同的社会价值、市场前景与资源需求。</p><div class="choice-row">${choices('book',state.book,[['hot','热点话题','社会关注高'],['rider','小众研究','关注特定群体'],['science','公共科普','面向广泛读者']])}</div><div class="book-detail"><div class="category">${b.category}</div><h2>${b.title}</h2><p>${b.desc}</p><table class="data-table"><tbody><tr><th>项目成本</th><td><strong>${r.cost} 万元</strong>${r.subsidy?` <small>（含专项减负 ${r.subsidy} 万元）</small>`:''}</td></tr><tr><th>编辑投入</th><td>${r.weeks} 周${d==='adjust'?' · 已缩小选题范围':''}</td></tr><tr><th>目标读者</th><td>${b.audience}</td></tr></tbody></table><p class="micro-note">内容价值：${b.value}</p></div></div><aside class="side"><div class="section-title"><h2>改变生产条件</h2></div><p class="muted small">拨动条件，看看资源是否能够支持出版。</p><div class="segmented" aria-label="资源条件"><button data-action="support" data-value="false" aria-pressed="${!state.support}">资源有限</button><button data-action="support" data-value="true" aria-pressed="${state.support}">专项支持</button></div><div class="resources"><div class="resource"><label>可用预算</label><b>6</b><small>万元</small></div><div class="resource"><label>编辑时间</label><b>${r.availableWeeks}</b><small>周</small></div></div>${[['预算缺口',r.moneyGap,'万元',r.moneyGap/b.cost],['时间缺口',r.timeGap,'周',r.timeGap/b.weeks]].map(([name,gap,unit,ratio])=>`<div class="meter-row"><div class="meter-label"><span>${name}</span><strong>${gap===0?'已满足':`${gap} ${unit}`}</strong></div><div class="meter ${gap===0?'ok':''}"><span style="width:${gap===0?100:Math.max(4,ratio*100)}%"></span></div></div>`).join('')}<p class="support-copy">专项支持的模拟规则：小众研究与公共科普各减负 3 万元，可用编辑时间由 6 周增加至 8 周。热点选题不获得成本补助。</p></aside></div><div class="decision-row" aria-label="出版决策">${[['publish','出版'],['adjust','调整方案'],['hold','暂缓']].map(([v,t])=>`<button class="btn" data-action="decision" data-value="${v}" aria-pressed="${d===v}">${t}</button>`).join('')}</div><div class="insight" id="publishing-result"><h3>${explanation}</h3><p>${body}</p>${d?'<p class="prompt">方法论追问：改变资源配置之后，你会改变选择吗？社会效益与经济效益如何协调？</p>':''}</div>${bottom(1,'进入分发')}</section>`;}
function distribution(){const list=rank(state.rule),pos=position(state.rule),rule=RULES[state.rule];return `<section class="screen">${heading(2,'分配规则','这本书排在哪里？','改变评价目标，同一组内容会获得怎样的可见性？')}<div class="rule-tabs" aria-label="推荐目标">${Object.entries(RULES).map(([k,v])=>`<button data-action="rule" data-value="${k}" aria-pressed="${state.rule===k}">${v.name}</button>`).join('')}</div><div class="rank-layout"><div><div class="section-title"><h2>模拟推荐列表</h2></div><p class="micro-note">固定候选书目，仅改变排序目标；分数保留一位小数。</p><div id="ranking">${list.map((b,i)=>`<article class="rank-row ${b.id==='rider'?'focus':''}" data-book="${b.id}"><span class="rank-num">${String(i+1).padStart(2,'0')}</span><div class="mini-cover" style="background:${b.color}" aria-hidden="true">${b.short}</div><div><h3>${b.title}</h3><p>${b.category}${b.id==='rider'?' · 本次追踪的书':''}</p></div><div class="score">${b.score.toFixed(1)}<small>演示排序分</small></div></article>`).join('')}</div><details class="disclosure"><summary>展开全部输入分值与计算规则</summary><p>所有分值取 0—100，均为人工设定。不是点击量、读者调查结果，也不是知识价值的客观测量。并列时按书目 ID 排序。</p><div class="raw-wrap"><table class="raw-data"><thead><tr><th>书目</th><th>热度</th><th>兴趣</th><th>题材补充度</th><th>扶持分</th></tr></thead><tbody>${DATA.map(b=>`<tr><td>${b.title}</td><td>${b.heat}</td><td>${b.interest}</td><td>${b.diversity}</td><td>${b.public}</td></tr>`).join('')}</tbody></table></div><p>${rule.limit}</p></details></div><aside class="side"><h3>《骑手的一天》当前排名</h3><div class="rank-big"><strong id="rider-rank">${pos}</strong><span>/ 5</span></div><p class="muted small">热度优先时为第 5 位</p><div class="formula">${rule.formula}</div>${state.rankTouched?`<div class="insight"><h3>你改变了评价目标</h3><p>${rule.why}</p><p class="prompt">谁决定评价指标？什么劳动与价值没有进入数据？</p></div>`:'<div class="insight"><h3>换一种目标，再看一次。</h3><p>先切换推荐规则，观察《骑手的一天》的位置如何变化，再展开专业解释。</p></div>'}<p class="micro-note">本页假设五本书均已出版，以单独观察分发规则。你的出版决定会在综合实验中联动；排名不等于真实曝光量。</p></aside></div>${bottom(2,'进入理解')}</section>`;}
function framing(){const f=FRAMES[state.frame];return `<section class="screen">${heading(3,'问题定义','你看见了怎样的骑手？','同一组事实，可以讲述不同的故事。每种解释的边界在哪里？')}<div class="choice-row">${choices('frame',state.frameTouched?state.frame:null,Object.entries(FRAMES).map(([k,v])=>[k,v.name]))}</div><div class="frame-layout"><article class="news-preview"><div class="news-meta"><span>课堂报道样稿</span><span>虚构案例 · 非真实新闻</span></div>${state.frameTouched?`<h2>${f.headline}</h2><p class="news-deck">${f.deck}</p><p class="news-angle">叙事焦点：${f.angle}</p>`:'<h2>同一个小林，<br>会进入怎样的报道？</h2><p class="news-deck">先选择一种报道框架。六条事实材料保持不变，报道强调的信息将被标出。</p><p class="news-angle">我们不预设某一种框架天然正确。</p>'}</article><div><div class="section-title"><h2>同一组事实材料</h2></div><p class="micro-note">以下均为教学虚构。“未突出”不等于事实不存在。</p><ol class="facts">${FACTS.map((fact,i)=>`<li class="${state.frameTouched&&f.focus.includes(i)?'emphasis':''}"><span>${String(i+1).padStart(2,'0')}</span><div>${fact}</div><em>${!state.frameTouched?'待选择':f.focus.includes(i)?'被强调':'未突出'}</em></li>`).join('')}</ol></div></div>${state.frameTouched?`<div class="insight"><h3>解释了什么，又留下什么？</h3><p>${f.explain}</p><p class="prompt">方法论追问：${f.question}</p></div>`:''}${bottom(3,'进入综合实验')}</section>`;}
function expInit(force=false){if(force||!state.experiment){const base=snapshot();state.experiment={base,variant:{...base,feedback:false}};save();}}
function expOutcome(s){const p=publication(s),book=DATA.find(b=>b.id===s.book);return{production:p.short,distribution:p.ready?`第 ${position(s.rule,s.book)} / 5 位`:'尚未进入分发',understanding:s.frameTouched?FRAMES[s.frame].name:'尚未选择框架',book:book.title};}
function experiment(){expInit();const {base,variant:v}=state.experiment,b=expOutcome(base),s=expOutcome(v),changed=['support','rule','frame','feedback'].filter(k=>base[k]!==v[k]||(k==='frame'&&base.frameTouched!==v.frameTouched)),ready=publication(v).ready;let findings=[];if(base.support!==v.support)findings.push('改变专项支持会改变资源缺口，但不会替你重做出版决定。');if(base.rule!==v.rule)findings.push(ready?'排序目标改变后，候选书目的位置按公开公式重算；真实曝光与阅读效果仍不能据此确定。':'你改变了排序目标，但当前出版环节尚未通过。候选排序可以演示，实际进入分发仍以出版为前提。');if(base.frame!==v.frame||base.frameTouched!==v.frameTouched)findings.push('报道框架改变了被突出的材料；受众是否因此改变理解，需要访谈或实验检验。');if(v.feedback)findings.push('主动搜索、分享与社群讨论可能反过来影响生产与分发。本模型没有估计反馈强度，因此不自动加分。');if(!findings.length)findings.push('目前条件与对照组相同。先只改变一个条件，观察哪个环节发生变化。');return `<section class="screen">${heading(4,'联系与反馈','<span class="phrase">改变一个条件，</span><wbr><span class="phrase">会怎样？</span>','保留一组选择作为对照，检验变化从哪里发生、又在哪里止步。')}<p class="micro-note">追踪选题：《${s.book}》 · 出版决定：${{publish:'出版',adjust:'调整方案',hold:'暂缓'}[base.decision]||'尚未选择'}。如需改变选题或决策，请回到出版页，再更新对照。</p><div class="experiment-controls"><div class="field"><label for="exp-support">01 生产条件</label><select id="exp-support" data-exp="support"><option value="false" ${!v.support?'selected':''}>资源有限</option><option value="true" ${v.support?'selected':''}>获得专项支持</option></select></div><div class="field"><label for="exp-rule">02 推荐目标</label><select id="exp-rule" data-exp="rule">${Object.entries(RULES).map(([k,r])=>`<option value="${k}" ${v.rule===k?'selected':''}>${r.name}</option>`).join('')}</select></div><div class="field"><label for="exp-frame">03 报道框架</label><select id="exp-frame" data-exp="frame"><option value="" ${!v.frameTouched?'selected':''} disabled>选择报道框架</option>${Object.entries(FRAMES).map(([k,f])=>`<option value="${k}" ${v.frameTouched&&v.frame===k?'selected':''}>${f.name}</option>`).join('')}</select></div></div><div class="compare-labels"><span>灰色为对照 · 砖红为变化${changed.length>1?' · 已改动多项，不能把结果归因于单一因素':''}</span><button class="btn" data-action="capture">用前面选择更新对照</button></div><div class="chain">${[['production','能否生产','资源可行性 ≠ 实际出版结果'],['distribution','能否被推荐',RULES[v.rule].name+' · 未模拟真实流量'],['understanding','如何被理解','显示叙事焦点，不预测受众效果']].map(([key,name,note],i)=>`<article class="chain-node"><h3><span class="node-number">0${i+1}</span>${name}</h3><div class="compare-before">对照：${b[key]}</div><div class="compare-after ${s[key]!==b[key]?'changed':''}" data-outcome="${key}">${s[key]}</div><p>${note}</p></article>`).join('')}</div><div class="feedback"><div><h3><span class="phrase">公共讨论 → </span> <span class="phrase">读者实践 → </span> <span class="phrase">生产与分发</span></h3><p>存在反馈，不意味着不同主体拥有同等的影响力。</p></div><label class="switch-label"><input type="checkbox" id="exp-feedback" data-exp="feedback" ${v.feedback?'checked':''}>加入读者主动搜索与讨论</label></div><div class="comparison-conclusion"><h3>哪些可以解释，哪些仍需证据？</h3><ul>${findings.map(t=>`<li>${t}</li>`).join('')}</ul><p class="micro-note">这是一组条件性机制演示，不是对现实传播效果的因果证明。</p></div><button class="btn text" data-action="restore">恢复到对照条件</button>${bottom(4,'回到共同方法')}</section>`;}
function reflection(){return `<section class="screen">${heading(5,'共同方法','从三个专业，回到同一个问题。','依据是什么？解释到哪里？还有什么不能证明？')}<p class="summary-quote">知识的可见性并非仅由内容质量决定，而是在<span style="color:var(--orange)">生产条件、分配规则与传播实践</span>的相互作用中形成。</p><div class="summary-grid"><div><div class="section-title"><h2>以历史唯物主义的总体视角</h2></div><details class="method" open><summary>01 从生产条件出发</summary><p>书籍、推荐结果与报道背后，都有劳动者、技术工具、组织制度与资源投入。把内容放回具体的生产过程，才可能解释“为什么这样选择”。</p><small>追问：哪些劳动与成本，在最终页面上不可见？</small></details><details class="method"><summary>02 在具体条件中分析矛盾</summary><p>知识的公共价值，与短期、可量化反馈之间存在张力。点击、销量与互动有其意义，但不能完整代表知识价值。不能预先认定商业必然损害文化。</p><small>追问：什么条件下，市场反馈有助于传播？什么条件下又会形成限制？</small></details><details class="method"><summary>03 把受众放回实践过程</summary><p>读者通过搜索、评价、分享与社群参与，可能反过来影响生产和分发。反馈是研究对象，而非必然有效的保证；不同主体拥有不同的行动资源。</p><small>追问：如何观察反馈，并区分参与机会与实际影响？</small></details></div><div><div class="section-title"><h2>一个案例，三份材料</h2></div><p class="micro-note">下列为证据补充位置，目前未填入真实研究材料。</p><details class="evidence"><summary>出版：编辑决策材料<span>待补充</span></summary><p>补入公开编辑访谈或出版机构材料。记录作者、日期、原文链接与关键段落；说明材料如何支持资源、市场与社会需要的判断。</p></details><details class="evidence"><summary>信息通信：推荐系统说明<span>待补充</span></summary><p>补入公开技术说明或研究文献，明确本模型借鉴了什么、简化了什么。现有权重与分值均是为课堂交互而设定。</p></details><details class="evidence"><summary>新闻传播：两篇报道对照<span>待补充</span></summary><p>补入同一议题的两篇真实报道，对照标题、消息来源、问题定义与责任归因。页面中的三篇样稿不能替代真实报道证据。</p></details><div class="insight"><h3>触达之外，还要看什么？</h3><p>理解程度、内容多样性，以及不同群体的表达机会。评价传播，需要比排名更丰富的证据。</p></div></div></div><div class="boundary"><table class="data-table"><thead><tr><th>网页可以帮助我们</th><th>不能据此直接证明</th></tr></thead><tbody><tr><td>演示规则改变如何影响模拟结果</td><td>真实平台必然按相同规则运行</td></tr><tr><td>理解一种可能的作用机制</td><td>该机制在现实中的影响有多大</td></tr><tr><td>记录本次选择，形成讨论材料</td><td>全体读者都具有相同偏好</td></tr></tbody></table></div><h3><label for="notes">把讨论带回现实</label></h3><textarea id="notes" class="notes" maxlength="10000" placeholder="记下你还想验证的问题，或准备补充的材料……">${esc(state.notes)}</textarea><div class="summary-actions"><span class="saved-note">选择与笔记仅保存在当前浏览器；不收集全班数据。</span><div class="actions"><button class="btn" data-action="download">下载本次讨论记录</button><button class="btn text" data-action="reset">重新开始</button></div></div>${bottom(5,'回到首页')}</section>`;}
function render(){document.getElementById('nav').innerHTML=LABELS.map((l,i)=>`<button data-go="${i}" ${page===i?'aria-current="page"':''}><span>${String(i+1).padStart(2,'0')}</span>${l}</button>`).join('');document.getElementById('main').innerHTML=[home,publishing,distribution,framing,experiment,reflection][page]();document.title=`${LABELS[page]}｜谁决定什么知识被看见？`;}
function go(n){page=Math.max(0,Math.min(5,Number(n)||0));history.replaceState(null,'','#'+HASHES[page]);render();window.scrollTo({top:0,behavior:'instant'});document.getElementById('main').focus({preventScroll:true});}
function rerender(button){const a=button?.dataset.action,v=button?.dataset.value;save();render();if(a){const candidate=[...document.querySelectorAll('[data-action]')].find(el=>el.dataset.action===a&&el.dataset.value===v);candidate?.focus({preventScroll:true});}}
document.addEventListener('click',e=>{const button=e.target.closest('button');if(!button)return;if(button.dataset.go!==undefined){go(button.dataset.go);return;}const a=button.dataset.action,v=button.dataset.value;if(a==='explore'){document.getElementById('entries').scrollIntoView({behavior:'smooth',block:'center'});document.querySelector('.entry').focus({preventScroll:true});return;}if(a==='book'){state.book=v;state.decision=null;}else if(a==='support'){state.support=v==='true';}else if(a==='decision'){state.decision=v;announce('已记录选择：'+button.textContent);}else if(a==='rule'){state.rule=v;state.rankTouched=true;announce(`《骑手的一天》当前排名第 ${position(v)} 位`);}else if(a==='frame'){state.frame=v;state.frameTouched=true;announce('已标出该框架强调的两条事实');}else if(a==='capture'){expInit(true);announce('已用前面三个环节的选择更新对照');}else if(a==='restore'){state.experiment.variant={...state.experiment.base,feedback:false};announce('已恢复对照条件');}else if(a==='reset'){document.getElementById('reset-dialog').showModal();return;}else if(a==='cancel-reset'){document.getElementById('reset-dialog').close();return;}else if(a==='confirm-reset'){state=initial();save();document.getElementById('reset-dialog').close();go(0);announce('已开始新的探索');return;}else if(a==='download'){download();return;}else{return;}rerender(button);});
document.addEventListener('change',e=>{const k=e.target.dataset.exp;if(!k)return;const v=state.experiment.variant;if(k==='support')v.support=e.target.value==='true';else if(k==='feedback')v.feedback=e.target.checked;else v[k]=e.target.value;if(k==='frame')v.frameTouched=true;const id=e.target.id;save();render();document.getElementById(id)?.focus({preventScroll:true});announce('实验结果已更新');});
document.addEventListener('input',e=>{if(e.target.id==='notes'){state.notes=e.target.value;save();}});
document.addEventListener('keydown',e=>{if(e.altKey||e.ctrlKey||e.metaKey||e.shiftKey||document.getElementById('reset-dialog').open)return;if(['INPUT','TEXTAREA','SELECT','BUTTON','SUMMARY'].includes(e.target.tagName)||e.target.isContentEditable)return;if(e.key==='ArrowRight'&&page<5){e.preventDefault();go(page+1);}if(e.key==='ArrowLeft'&&page>0){e.preventDefault();go(page-1);}});
window.addEventListener('hashchange',()=>{page=Math.max(0,HASHES.indexOf(location.hash.slice(1)));render();});
function download(){const b=DATA.find(b=>b.id===state.book);let text=`谁决定什么知识被看见？——本次讨论记录\n\n选题：${b.title}\n生产条件：${state.support?'专项支持':'资源有限'}\n出版决定：${{publish:'出版',adjust:'调整方案',hold:'暂缓'}[state.decision]||'未选择'}\n资源结果：${publication(state).short}\n推荐目标：${RULES[state.rule].name}\n《骑手的一天》候选排名：${position(state.rule)} / 5\n报道框架：${state.frameTouched?FRAMES[state.frame].name:'未选择'}\n`;
if(state.experiment){text+='\n综合实验\n';for(const [name,s] of [['对照',state.experiment.base],['改变后',state.experiment.variant]]){const o=expOutcome(s);text+=`${name}：${s.support?'专项支持':'资源有限'} / ${RULES[s.rule].name} / ${o.production} / ${o.distribution} / ${o.understanding} / 读者反馈${s.feedback?'开启':'未开启'}\n`;}}
text+=`\n讨论笔记\n${state.notes||'（尚未填写）'}\n\n说明：所有书目、样稿、分值与规则均为教学模拟。模拟用于解释机制，现实判断仍需要证据。\n`;const blob=new Blob(['\ufeff'+text],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='知识的可见性_本次讨论记录.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);announce('讨论记录已生成');}
page=Math.max(0,HASHES.indexOf(location.hash.slice(1)));render();
</script>
